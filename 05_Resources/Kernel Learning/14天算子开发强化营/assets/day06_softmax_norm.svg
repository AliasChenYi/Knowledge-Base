<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="#fbfbf8"/>
  <text x="40" y="52" font-size="28" font-family="Arial, 'Microsoft YaHei'" font-weight="700" fill="#20242b">Day 6：Softmax 与 LayerNorm 的共同模式</text>
  <g font-family="Arial, 'Microsoft YaHei'" font-size="17" text-anchor="middle">
    <rect x="90" y="145" width="135" height="70" rx="9" fill="#e8f2ff" stroke="#2f6fb2" stroke-width="2"/>
    <text x="158" y="185">输入一行</text>
    <rect x="285" y="145" width="145" height="70" rx="9" fill="#fff0d8" stroke="#c9801c" stroke-width="2"/>
    <text x="358" y="175">归约</text><text x="358" y="198">max/mean</text>
    <rect x="490" y="145" width="145" height="70" rx="9" fill="#fff0d8" stroke="#c9801c" stroke-width="2"/>
    <text x="563" y="175">归约</text><text x="563" y="198">sum/var</text>
    <rect x="695" y="145" width="165" height="70" rx="9" fill="#dff6e8" stroke="#3a7d44" stroke-width="2"/>
    <text x="778" y="185">归一化输出</text>
    <g stroke="#555" stroke-width="2" marker-end="url(#arrow6)">
      <line x1="225" y1="180" x2="282" y2="180"/>
      <line x1="430" y1="180" x2="487" y2="180"/>
      <line x1="635" y1="180" x2="692" y2="180"/>
    </g>
  </g>
  <rect x="150" y="295" width="300" height="112" rx="10" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="175" y="328" font-size="18" font-family="Arial, 'Microsoft YaHei'" font-weight="700" fill="#20242b">Softmax</text>
  <text x="175" y="360" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#405060">1. 每行 max，防止 exp 溢出</text>
  <text x="175" y="387" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#405060">2. exp 后 sum，再除以 sum</text>
  <rect x="530" y="295" width="300" height="112" rx="10" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="555" y="328" font-size="18" font-family="Arial, 'Microsoft YaHei'" font-weight="700" fill="#20242b">LayerNorm/RMSNorm</text>
  <text x="555" y="360" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#405060">1. 每行 mean/variance 或 rms</text>
  <text x="555" y="387" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#405060">2. FP32 累加，最后 scale/bias</text>
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
