  <text x="145" y="135" font-size="22" font-family="Arial, 'Microsoft YaHei'" font-weight="700" fill="#1b4f8a">CPU</text>
  <rect x="105" y="165" width="160" height="46" rx="6" fill="#ffffff" stroke="#7aa7d9"/>
  <text x="145" y="194" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#223">寄存器</text>
  <rect x="105" y="225" width="160" height="46" rx="6" fill="#ffffff" stroke="#7aa7d9"/>
  <text x="155" y="254" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#223">L1/L2</text>
  <rect x="105" y="285" width="160" height="46" rx="6" fill="#ffffff" stroke="#7aa7d9"/>
  <text x="160" y="314" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#223">DRAM</text>
  <text x="98" y="370" font-size="15" font-family="Arial, 'Microsoft YaHei'" fill="#405060">强单线程、复杂控制</text>
  <text x="98" y="397" font-size="15" font-family="Arial, 'Microsoft YaHei'" fill="#405060">cache 自动管理为主</text>
  <rect x="370" y="100" width="540" height="320" rx="10" fill="#fff7e8" stroke="#c9801c" stroke-width="2"/>
  <text x="610" y="135" font-size="22" font-family="Arial, 'Microsoft YaHei'" font-weight="700" fill="#8a5315">GPU/NPU</text>
  <rect x="405" y="165" width="145" height="46" rx="6" fill="#ffffff" stroke="#d9a44f"/>
  <text x="445" y="194" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#223">寄存器</text>
  <rect x="580" y="165" width="145" height="46" rx="6" fill="#ffffff" stroke="#d9a44f"/>
  <text x="620" y="194" font-size="16" font-family="Arial, 'Microsoft YaHei'" fill="#223">片上 SRAM</text>
  <rect x="755" y="165" width="110" height="46" rx="6" fill="#ffffff" stroke="#d9a44f"/>
