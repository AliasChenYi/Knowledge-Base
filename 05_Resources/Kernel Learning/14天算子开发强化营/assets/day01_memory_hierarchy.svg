  <path d="M635 240 L477 218" stroke="#8a5315" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M635 240 L810 218" stroke="#8a5315" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="428" y="365" font-size="15" font-family="Arial, 'Microsoft YaHei'" fill="#405060">大量线程隐藏延迟；性能关键是数据复用和内存访问模式</text>
